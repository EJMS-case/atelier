<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale=1.0 kills iOS Safari's focus auto-zoom on small-font
         inputs (users got stuck zoomed in); modern iOS still allows manual
         pinch-zoom despite it. viewport-fit=cover fills the notch area. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <title>Atelier — My Wardrobe</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1a1613" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <!-- Fonts start downloading before the JS bundle parses (was an @import
         inside a component <style>, which serialized font fetch behind React). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=DM+Serif+Display&display=swap" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      /* Matches the app canvas (--color-bg) so first paint doesn't flash a
         different tint before React hydrates. */
      body { background: #FDF8F0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
